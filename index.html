<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 42px; }
    p { color: #b9c3d3; font-size: 18px; }
    .button {
      margin-top: 20px;
      padding: 14px 28px;
      background: #3979ff;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to My Website</h1>
    <p>My first website is officially online!</p>
    <a class="button" href="https://github.com">Visit GitHub</a>
  </main>
</body>
</html>
