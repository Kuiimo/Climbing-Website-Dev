</style><link rel="stylesheet" href="desktop-overhaul.css?v=1"></head><body><header><nav class="wrap nav"><a class="brand" href="index.html"><img class="brand-logo" src="icons/icon-192.png?v=5" alt="" aria-hidden="true"> CLIMB TRACKER</a><div class="links"><a href="index.html">Home</a><a href="track.html">Track Climbs</a><a href="profile.html">My Profile</a><a href="leaderboard.html">Leaderboard</a><a class="active" href="gallery.html">Gallery</a></div></nav></header><main class="wrap page"><h1>Climbing Gallery</h1><p class="muted">Photos and videos from the climbing crew. Tap a climber to see their profile, stats and uploads.</p><div id="feed"></div><p id="status" class="notice" role="status"></p><button id="more" class="button" type="button">Load more posts</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const $ = id => document.getElementById(id);
function avatar(name,url){const d=document.createElement('span');d.className='avatar';d.textContent=(name||'?').charAt(0).toUpperCase();if(url){const im=document.createElement('img');im.src=url;im.alt='';im.loading='lazy';im.onerror=()=>{im.remove();d.textContent=(name||'?').charAt(0).toUpperCase()};d.textContent='';d.append(im)}return d}
function dateLabel(v){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/London'}).format(new Date(v))}
function mediaUrl(path){return supabaseClient.storage.from('climb-media').getPublicUrl(path).data.publicUrl}
function mediaNode(item){const el=document.createElement(item.media_type==='video'?'video':'img');el.src=mediaUrl(item.storage_path);el.className='post-media';if(item.media_type==='video'){el.controls=true;el.preload='metadata';el.playsInline=true}else{el.alt='Climbing upload';el.loading='lazy'}return el}
function titleFor(climb){return (climb?.colour ? climb.colour.charAt(0).toUpperCase()+climb.colour.slice(1) : 'Unknown')+' V'+(climb?.grade??'?')}
async function getProfiles(ids){if(!ids.length)return new Map();const {data,error}=await supabaseClient.from('profiles').select('id,username,avatar_url').in('id',ids);if(error)throw error;return new Map((data||[]).map(x=>[x.id,x]))}
async function getClimbs(ids){if(!ids.length)return new Map();const {data,error}=await supabaseClient.from('climbs').select('id,colour,grade,is_active').in('id',ids);if(error)throw error;return new Map((data||[]).map(x=>[x.id,x]))}
function userLink(userId,profile){const a=document.createElement('a');a.href='climber.html?id='+encodeURIComponent(userId);a.className='user-link';a.append(avatar(profile?.username,profile?.avatar_url));const span=document.createElement('span');span.textContent=profile?.username||'Climber';a.append(span);return a}
function renderPost(item,profiles,climbs){const climb=climbs.get(item.climb_id);if(!climb||!climb.is_active)return null;const user=profiles.get(item.user_id);const article=document.createElement('article');article.className='post';const header=document.createElement('div');header.className='post-head';header.append(userLink(item.user_id,user));const stamp=document.createElement('time');stamp.dateTime=item.created_at;stamp.textContent=dateLabel(item.created_at);header.append(stamp);const title=document.createElement('h2');title.textContent=titleFor(climb)+' completed by '+(user?.username||'Climber');const note=document.createElement('p');note.className='muted';note.textContent='Uploaded on '+dateLabel(item.created_at);article.append(header,mediaNode(item),title,note);return article}

let offset=0;const PAGE=18;let loading=false,done=false;
async function loadMore(){if(loading||done)return;loading=true;$('more').disabled=true;$('status').textContent='Loading posts...';try{const {data,error}=await supabaseClient.from('climb_media').select('id,climb_id,user_id,storage_path,media_type,created_at').order('created_at',{ascending:false}).range(offset,offset+PAGE-1);if(error)throw error;offset+=(data||[]).length;const profiles=await getProfiles([...new Set((data||[]).map(x=>x.user_id))]);const climbs=await getClimbs([...new Set((data||[]).map(x=>x.climb_id))]);let count=0;for(const item of data||[]){const card=renderPost(item,profiles,climbs);if(card){$('feed').append(card);count++}}if((data||[]).length<PAGE)done=true;$('more').hidden=done;$('status').textContent=done?($('feed').children.length?'You are all caught up!':'No uploads yet. Complete a climb and add a photo or video on the tracker!'):'';}catch(e){console.error(e);$('status').textContent='Could not load gallery: '+e.message;$('more').hidden=false}finally{loading=false;$('more').disabled=false}}
$('more').onclick=loadMore;
(async()=>{const {data}=await supabaseClient.auth.getUser();if(!data.user){location.replace('login.html');return}await loadMore()})();
</script><nav class="mobile-app-bar" aria-label="Mobile navigation"><a href="index.html"><span class="app-icon" aria-hidden="true">⌂</span><span>Home</span></a><a href="track.html"><span class="app-icon" aria-hidden="true">⌖</span><span>Track</span></a><a href="gallery.html" aria-current="page"><span class="app-icon" aria-hidden="true">▧</span><span>Gallery</span></a><a href="leaderboard.html"><span class="app-icon" aria-hidden="true">★</span><span>Ranks</span></a><a href="profile.html"><span class="app-icon" aria-hidden="true">◉</span><span>Profile</span></a></nav><script>
