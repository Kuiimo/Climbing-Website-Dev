<style>
header { background:#142133; border-bottom:1px solid #334155; }
header .nav { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-top:20px; padding-bottom:20px; }

header .links { display:flex; flex-wrap:wrap; gap:10px; }

header .links a.active { background:#35b8b5; color:#081521; }
.leaderboard-page { padding-top:35px; padding-bottom:45px; }
.leaderboard-tabs { display:flex; gap:10px; margin:25px 0; }
.leaderboard-tabs button { flex:1; padding:13px; background:#374151; color:white; border:0; border-radius:10px; cursor:pointer; }
.leaderboard-tabs button.active { background:#35b8b5; color:#081521; font-weight:700; }

.player-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.player-info { flex:1; min-width:0; }

</style>

<body>
<header><nav class="wrap nav">
<a class="brand" href="index.html"><img class="brand-logo" src="icons/icon-192.png?v=5" alt="" aria-hidden="true"> CLIMB TRACKER</a>
<div class="links"><a href="index.html">Home</a><a href="track.html">Track Climbs</a><a href="profile.html">My Profile</a>
      <a href="gallery.html">Gallery</a><a class="active" href="leaderboard.html">Leaderboard</a></div>
</nav></header>
<main class="wrap leaderboard-page">
<h1>Leaderboard</h1>
<div class="leaderboard-tabs" style="display:block"><label for="leaderboardPeriod" style="display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:650">Show leaderboard <select id="leaderboardPeriod" style="min-height:44px;min-width:150px;max-width:65%;padding:9px 12px;border-radius:10px;background:#24364d;color:white;border:1px solid #64748b;font:inherit"><option value="monthly">This Month</option><option value="alltime">All Time</option><option value="last7">Last 7 Days</option><option value="custom">Custom Dates</option></select></label></div>
<div class="period-date-range" id="leaderboardCustomRange" hidden><label>From<input id="leaderboardDateStart" type="date"></label><label>To<input id="leaderboardDateEnd" type="date"></label><button id="leaderboardApplyDates" type="button">Apply dates</button></div>
<div id="playerList"></div>
<p id="leaderboardMessage" role="status"></p>
</main>
<footer><div class="wrap"></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
let currentPeriod = "monthly";

function ukToday(offsetDays=0){
 const london = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const parts=Object.fromEntries(london.map(p=>[p.type,p.value]));
 const utc=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)+offsetDays));
 return utc.toISOString().slice(0,10);
}
function validateDates(start,end){
 if(!start||!end)throw new Error('Choose both a start and an end date.');
 if(start>end)throw new Error('The start date must be on or before the end date.');
 if(end>ukToday())throw new Error('The end date cannot be in the future.');
}
async function fetchPeriodLeaderboard(period,start,end){
 if(period==='monthly'||period==='alltime'){
  const view=period==='monthly'?'monthly_leaderboard_flashes':'leaderboard_flashes';
  return await supabaseClient.from(view).select('id, username, total_sends, points, hardest_grade');
 }
 if(period==='last7'){start=ukToday(-6);end=ukToday();}
 validateDates(start,end);
 return await supabaseClient.rpc('leaderboard_for_dates',{start_date:start,end_date:end});
}

let currentUser = null;
let loadNumber = 0;

function sortPlayers(rows) {
  return [...rows].sort((a,b) =>
    Number(b.points)-Number(a.points) ||
    Number(b.total_sends)-Number(a.total_sends) ||
    String(a.username).localeCompare(String(b.username))
  );
}

function makeAvatar(player, avatarUrl) {
  const avatar = document.createElement("div");
  avatar.className = "player-avatar";
  const initial = (player.username || "?").trim().charAt(0).toUpperCase() || "?";
  avatar.textContent = initial;
  if (avatarUrl && typeof avatarUrl === "string") {
    const img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.onerror = () => { img.remove(); avatar.textContent = initial; };
    img.src = avatarUrl;
    avatar.textContent = "";
    avatar.appendChild(img);
  }
  return avatar;
}

async function loadLeaderboard() {
  const request = ++loadNumber;
  const list = document.getElementById("playerList");
  const message = document.getElementById("leaderboardMessage");
  list.replaceChildren();
  message.textContent = "Loading leaderboard...";
  try {
    const {data,error} = await fetchPeriodLeaderboard(currentPeriod,document.getElementById('leaderboardDateStart').value,document.getElementById('leaderboardDateEnd').value);
    if (error) throw error;
    const players = sortPlayers(data || []);
    const avatars = new Map();
    if (players.length) {
      const ids = players.map(p => p.id).filter(Boolean);
      if (ids.length) {
        const photoResult = await supabaseClient.from("profiles").select("id, avatar_url").in("id", ids);
        if (photoResult.error) {
          console.warn("Profile photos could not be loaded:", photoResult.error.message);
        } else {
          for (const p of photoResult.data || []) avatars.set(p.id, p.avatar_url);
        }
      }
    }
    if (request !== loadNumber) return;
    if (!players.length) { message.textContent = "No climbers yet."; return; }
    const fragment = document.createDocumentFragment();
    players.forEach((player,index) => {
      const row = document.createElement("div");
      row.className = "player-row";
      if (currentUser && player.id === currentUser.id) row.classList.add("me");
      const rank = document.createElement("div");
      rank.className = "player-rank";
      rank.textContent = "#" + (index+1);
      const avatar = makeAvatar(player, avatars.get(player.id));
      const info = document.createElement("div");
      info.className = "player-info";
      const name = document.createElement("div");
      name.className = "player-name";
      name.textContent = player.username || "Climber";
      const climbs = document.createElement("div");
      climbs.className = "player-climbs";
      climbs.textContent = player.total_sends + " climbs sent";
      const hardest = document.createElement("div");
      hardest.className = "player-hardest";
      hardest.textContent = "Hardest climb: " + (player.hardest_grade == null ? "—" : "V" + player.hardest_grade);
      info.append(name,climbs,hardest);
      const points = document.createElement("div");
      points.className = "player-points";
      points.textContent = player.points;
      const label = document.createElement("small");
      label.textContent = "points";
      points.appendChild(label);
      const profileLink = document.createElement("a");
      profileLink.className = "player-profile-link";
      profileLink.href = "climber.html?id=" + encodeURIComponent(player.id);
      profileLink.setAttribute("aria-label", "View " + (player.username || "climber") + "'s profile");
      profileLink.append(avatar,info);
      row.append(rank,profileLink,points);
      fragment.appendChild(row);
    });
    list.appendChild(fragment);
    message.textContent = "";
  } catch(error) {
    if (request !== loadNumber) return;
    console.error(error);
    message.textContent = "Could not load leaderboard: " + error.message;
  }
}

const periodPicker=document.getElementById('leaderboardPeriod');
const rangePanel=document.getElementById('leaderboardCustomRange');
const startPicker=document.getElementById('leaderboardDateStart');
const endPicker=document.getElementById('leaderboardDateEnd');
startPicker.value=ukToday(-6);endPicker.value=ukToday();
startPicker.max=ukToday();endPicker.max=ukToday();
periodPicker.addEventListener('change',()=>{
 currentPeriod=periodPicker.value;rangePanel.hidden=currentPeriod!=='custom';
 if(currentPeriod!=='custom')loadLeaderboard();
 else {document.getElementById('playerList').replaceChildren();document.getElementById('leaderboardMessage').textContent='Choose your dates and tap Apply dates.';}
});
document.getElementById('leaderboardApplyDates').addEventListener('click',()=>{currentPeriod='custom';loadLeaderboard();});
async function initialiseLeaderboard() {
  const auth = await supabaseClient.auth.getUser();
  currentUser = auth.data?.user || null;
  loadLeaderboard();
}
initialiseLeaderboard();
</script>
