
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climb Tracker | Leaderboard</title>
<link rel="stylesheet" href="style.css">

<style>
header {
  background: #142133;
  border-bottom: 1px solid #334155;
}
header .nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding-top: 20px;
  padding-bottom: 20px;
}
header .brand {
  color: #66d9d5;
  font-size: 16px;
  font-weight: 800;
  text-decoration: none;
  white-space: nowrap;
}
header .links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
header .links a {
  background: #24364d;
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  font-weight: 700;
  text-decoration: none;
}
header .links a.active {
  background: #35b8b5;
  color: #081521;
}
.leaderboard-page {
  padding-top: 35px;
  padding-bottom: 45px;
}
.leaderboard-tabs {
  display: flex;
  gap: 10px;
  margin: 25px 0;
}
.leaderboard-tabs button {
  flex: 1;
  padding: 13px;
  background: #374151;
  color: white;
  border: 0;
  border-radius: 10px;
  cursor: pointer;
}
.leaderboard-tabs button.active {
  background: #35b8b5;
  color: #081521;
  font-weight: 700;
}
.player-row {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 20px;
  margin-bottom: 12px;
  background: #1f2937;
  border: 1px solid #334155;
  border-radius: 14px;
}
.player-row.me {
  border-color: #35b8b5;
}
.player-rank {
  font-size: 25px;
  font-weight: 800;
  color: #66d9d5;
  min-width: 55px;
}
.player-info {
  flex: 1;
}
.player-name {
  font-weight: 800;
  font-size: 19px;
  color: white;
}
.player-climbs {
  color: #94a3b8;
  margin-top: 6px;
}
.player-points {
  color: #66d9d5;
  font-size: 24px;
  font-weight: 800;
  text-align: right;
}
.player-points small {
  display: block;
  font-size: 12px;
  font-weight: normal;
  color: #94a3b8;
}
#leaderboardMessage {
  color: #93c5fd;
}
@media (max-width: 700px) {
  header .nav {
    flex-direction: column;
    align-items: flex-start;
  }
  header .links a {
    padding: 10px 12px;
    font-size: 13px;
  }
}
</style>
</head>

<body>
<header>
  <nav class="wrap nav">
    <a class="brand" href="index.html">⛰ CLIMB TRACKER</a>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="track.html">Track Climbs</a>
      <a href="profile.html">My Profile</a>
      <a class="active" href="leaderboard.html">Leaderboard</a>
    </div>
  </nav>
</header>

<main class="wrap leaderboard-page">
  <h1>Leaderboard</h1>
  <div class="leaderboard-tabs">
    <button id="monthlyBtn" class="active">This Month</button>
    <button id="allTimeBtn">All Time</button>
  </div>

  <div id="playerList"></div>
  <p id="leaderboardMessage" role="status"></p>
</main>

<footer>
  <div class="wrap">
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
let currentPeriod = "monthly";
let currentUser = null;

function sortPlayers(rows) {
  return [...rows].sort((a, b) =>
    Number(b.points) - Number(a.points) ||
    Number(b.total_sends) - Number(a.total_sends) ||
    String(a.username).localeCompare(String(b.username))
  );
}

async function loadLeaderboard() {
  const list = document.getElementById("playerList");
  const message = document.getElementById("leaderboardMessage");

  list.replaceChildren();
  message.textContent = "Loading leaderboard...";

  try {
    const view = currentPeriod === "monthly"
      ? "monthly_leaderboard"
      : "leaderboard";

    const { data, error } = await supabaseClient
      .from(view)
      .select("id, username, total_sends, points");

    if (error) throw error;

    const players = sortPlayers(data || []);

    if (players.length === 0) {
      message.textContent = "No climbers yet.";
      return;
    }

    players.forEach((player, index) => {
      const row = document.createElement("div");
      row.className = "player-row";

      if (currentUser && player.id === currentUser.id) {
        row.classList.add("me");
      }

      const rank = document.createElement("div");
      rank.className = "player-rank";
      rank.textContent = "#" + (index + 1);

      const info = document.createElement("div");
      info.className = "player-info";

      const name = document.createElement("div");
      name.className = "player-name";
      name.textContent = player.username;

      const climbs = document.createElement("div");
      climbs.className = "player-climbs";
      climbs.textContent = player.total_sends + " climbs sent";

      info.append(name, climbs);

      const points = document.createElement("div");
      points.className = "player-points";
      points.textContent = player.points;

      const label = document.createElement("small");
      label.textContent = "points";
      points.appendChild(label);

      row.append(rank, info, points);
      list.appendChild(row);
    });

    message.textContent = "";

  } catch (error) {
    console.error(error);
    message.textContent = "Could not load leaderboard: " + error.message;
  }
}

document.getElementById("monthlyBtn").onclick = () => {
  currentPeriod = "monthly";
  document.getElementById("monthlyBtn").classList.add("active");
  document.getElementById("allTimeBtn").classList.remove("active");
  loadLeaderboard();
};

document.getElementById("allTimeBtn").onclick = () => {
  currentPeriod = "allTime";
  document.getElementById("allTimeBtn").classList.add("active");
  document.getElementById("monthlyBtn").classList.remove("active");
  loadLeaderboard();
};

async function initialiseLeaderboard() {
  const auth = await supabaseClient.auth.getUser();
  currentUser = auth.data?.user || null;
  loadLeaderboard();
}

initialiseLeaderboard();
</script>
</body>
</html>
