<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climb Tracker | Leaderboard</title>
<link rel="stylesheet" href="style.css">
<style>
header { background:#142133; border-bottom:1px solid #334155; }
header .nav { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-top:20px; padding-bottom:20px; }
header .brand { color:#66d9d5; font-size:16px; font-weight:800; text-decoration:none; white-space:nowrap; }
header .links { display:flex; flex-wrap:wrap; gap:10px; }
header .links a { background:#24364d; color:white; padding:12px 18px; border-radius:10px; font-weight:700; text-decoration:none; }
header .links a.active { background:#35b8b5; color:#081521; }
.leaderboard-page { padding-top:35px; padding-bottom:45px; }
.leaderboard-tabs { display:flex; gap:10px; margin:25px 0; }
.leaderboard-tabs button { flex:1; padding:13px; background:#374151; color:white; border:0; border-radius:10px; cursor:pointer; }
.leaderboard-tabs button.active { background:#35b8b5; color:#081521; font-weight:700; }
.player-row { display:flex; align-items:center; gap:18px; padding:20px; margin-bottom:12px; background:#1f2937; border:1px solid #334155; border-radius:14px; }
.player-row.me { border-color:#35b8b5; }
.player-rank { font-size:25px; font-weight:800; color:#66d9d5; min-width:55px; }
.player-avatar { width:54px; height:54px; flex:0 0 54px; border-radius:50%; background:#35b8b5; color:#081521; display:flex; align-items:center; justify-content:center; font-size:23px; font-weight:800; overflow:hidden; }
.player-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.player-info { flex:1; min-width:0; }
.player-name { font-weight:800; font-size:19px; color:white; overflow-wrap:anywhere; }
.player-climbs { color:#94a3b8; margin-top:6px; }
.player-points { color:#66d9d5; font-size:24px; font-weight:800; text-align:right; flex-shrink:0; }
.player-points small { display:block; font-size:12px; font-weight:normal; color:#94a3b8; }
#leaderboardMessage { color:#93c5fd; }
@media(max-width:700px) { header .nav { flex-direction:column; align-items:flex-start; } header .links a { padding:10px 12px; font-size:13px; } }
@media(max-width:480px) { .player-row { gap:10px; padding:12px; } .player-rank { font-size:19px; min-width:35px; } .player-avatar { width:42px; height:42px; flex-basis:42px; font-size:18px; } .player-name { font-size:16px; } .player-points { font-size:19px; } }
</style>
</head>
<body>
<header><nav class="wrap nav">
<a class="brand" href="index.html">⛰ CLIMB TRACKER</a>
<div class="links"><a href="index.html">Home</a><a href="track.html">Track Climbs</a><a href="profile.html">My Profile</a>
      <a href="gallery.html">Gallery</a><a class="active" href="leaderboard.html">Leaderboard</a></div>
</nav></header>
<main class="wrap leaderboard-page">
<h1>Leaderboard</h1>
<div class="leaderboard-tabs"><button id="monthlyBtn" class="active">This Month</button><button id="allTimeBtn">All Time</button></div>
<div id="playerList"></div>
<p id="leaderboardMessage" role="status"></p>
</main>
<footer><div class="wrap"></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
let currentPeriod = "monthly";
let currentUser = null;
let loadNumber = 0;

function sortPlayers(rows) {
  return [...rows].sort((a,b) =>
    Number(b.points)-Number(a.points) ||
    Number(b.total_sends)-Number(a.total_sends) ||
    String(a.username).localeCompare(String(b.username))
  );
}

function makeAvatar(player, avatarUrl) {
  const avatar = document.createElement("div");
  avatar.className = "player-avatar";
  const initial = (player.username || "?").trim().charAt(0).toUpperCase() || "?";
  avatar.textContent = initial;
  if (avatarUrl && typeof avatarUrl === "string") {
    const img = document.createElement("img");
    img.alt = "";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.onerror = () => { img.remove(); avatar.textContent = initial; };
    img.src = avatarUrl;
    avatar.textContent = "";
    avatar.appendChild(img);
  }
  return avatar;
}

async function loadLeaderboard() {
  const request = ++loadNumber;
  const list = document.getElementById("playerList");
  const message = document.getElementById("leaderboardMessage");
  list.replaceChildren();
  message.textContent = "Loading leaderboard...";
  try {
    const view = currentPeriod === "monthly" ? "monthly_leaderboard" : "leaderboard";
    const {data,error} = await supabaseClient.from(view).select("id, username, total_sends, points");
    if (error) throw error;
    const players = sortPlayers(data || []);
    const avatars = new Map();
    if (players.length) {
      const ids = players.map(p => p.id).filter(Boolean);
      if (ids.length) {
        const photoResult = await supabaseClient.from("profiles").select("id, avatar_url").in("id", ids);
        if (photoResult.error) {
          console.warn("Profile photos could not be loaded:", photoResult.error.message);
        } else {
          for (const p of photoResult.data || []) avatars.set(p.id, p.avatar_url);
        }
      }
    }
    if (request !== loadNumber) return;
    if (!players.length) { message.textContent = "No climbers yet."; return; }
    const fragment = document.createDocumentFragment();
    players.forEach((player,index) => {
      const row = document.createElement("div");
      row.className = "player-row";
      if (currentUser && player.id === currentUser.id) row.classList.add("me");
      const rank = document.createElement("div");
      rank.className = "player-rank";
      rank.textContent = "#" + (index+1);
      const avatar = makeAvatar(player, avatars.get(player.id));
      const info = document.createElement("div");
      info.className = "player-info";
      const name = document.createElement("div");
      name.className = "player-name";
      name.textContent = player.username || "Climber";
      const climbs = document.createElement("div");
      climbs.className = "player-climbs";
      climbs.textContent = player.total_sends + " climbs sent";
      info.append(name,climbs);
      const points = document.createElement("div");
      points.className = "player-points";
      points.textContent = player.points;
      const label = document.createElement("small");
      label.textContent = "points";
      points.appendChild(label);
      row.append(rank,avatar,info,points);
      fragment.appendChild(row);
    });
    list.appendChild(fragment);
    message.textContent = "";
  } catch(error) {
    if (request !== loadNumber) return;
    console.error(error);
    message.textContent = "Could not load leaderboard: " + error.message;
  }
}

document.getElementById("monthlyBtn").onclick = () => {
  currentPeriod = "monthly";
  document.getElementById("monthlyBtn").classList.add("active");
  document.getElementById("allTimeBtn").classList.remove("active");
  loadLeaderboard();
};
document.getElementById("allTimeBtn").onclick = () => {
  currentPeriod = "allTime";
  document.getElementById("allTimeBtn").classList.add("active");
  document.getElementById("monthlyBtn").classList.remove("active");
  loadLeaderboard();
};
async function initialiseLeaderboard() {
  const auth = await supabaseClient.auth.getUser();
  currentUser = auth.data?.user || null;
  loadLeaderboard();
}
initialiseLeaderboard();
</script>
</body>
</html>
